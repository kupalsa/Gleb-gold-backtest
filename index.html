<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101311"><title>Gold Backtest Ledger</title><link rel="stylesheet" href="styles.css"></head>
<body><a class="skip" href="#trade-form">Skip to trade form</a><header><p class="eyebrow">XAU / BACKTEST LEDGER</p><h1>Gold Backtest</h1><p id="data-status" class="status" role="status">Connecting to shared trade API…</p></header>
<main><section class="panel entry-panel" aria-labelledby="entry-heading"><div class="section-heading"><h2 id="entry-heading">Record trade</h2><p>All fields marked * are required.</p></div><form id="trade-form" novalidate><input id="trade-id" type="hidden"><div class="fields"><label>Trade date *<input id="date" name="date" type="date" required></label><label>Entry time *<input id="entryTime" name="entryTime" type="time" required></label><label>Direction *<select id="direction" name="direction"><option value="long">Long</option><option value="short">Short</option></select></label><label>Stop loss (gold points) *<input id="stopLossPoints" name="stopLossPoints" type="number" min="0.01" step="0.01" inputmode="decimal" required></label><label>Risk : reward *<input id="riskReward" name="riskReward" type="number" min="0.01" step="0.01" inputmode="decimal" required></label><label class="notes">Notes <input id="notes" name="notes" maxlength="240" placeholder="Optional setup note"></label></div><p id="form-error" class="error" role="alert"></p><div class="actions"><button class="primary" type="submit">Save trade</button><button id="cancel-edit" type="button" hidden>Cancel edit</button></div></form></section>
<section class="panel calendar-panel" aria-labelledby="calendar-heading"><div class="calendar-toolbar"><div><p class="eyebrow">CALENDAR</p><h2 id="calendar-heading" aria-live="polite"></h2></div><div class="month-buttons"><button id="previous-month" aria-label="Previous month">←</button><button id="today-month">Today</button><button id="next-month" aria-label="Next month">→</button></div></div><div class="weekdays" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="calendar" class="calendar" aria-label="Trade calendar"></div></section>
<section class="panel day-panel" aria-labelledby="day-heading"><div class="section-heading"><div><p class="eyebrow">SELECTED SESSION</p><h2 id="day-heading">Choose a date</h2></div><span id="day-count" class="count"></span></div><div id="trade-list" aria-live="polite"><p class="muted">Select a calendar day to inspect recorded trades.</p></div></section></main><template id="trade-row"><article class="trade-row"><div class="trade-meta"></div><div class="trade-values"></div><div class="row-actions"><button class="edit" type="button">Edit</button><button class="delete danger" type="button">Delete</button></div></article></template><script type="module" src="src/app.js"></script></body></html>
